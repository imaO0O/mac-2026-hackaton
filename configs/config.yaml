# Единая конфигурация проекта. Всё, что является ДОПУЩЕНИЕМ (не подтверждено
# выданными материалами), помечено ключом assumption: true — этого требует ТЗ.

paths:
  # Папка с исходной выдачей (xlsx, pdf, data.rar). Переопределяется NEFTE_SOURCE_DIR.
  source_dir: "C:/Users/USER/OneDrive/Desktop/oil"
  # Локальный кэш (распакованные csv + parquet). Переопределяется NEFTE_DATA_DIR.
  # Держим ВНЕ OneDrive: ~340 МБ csv не нужно синхронизировать.
  data_dir: "C:/Users/USER/nefte_data"
  files:
    avt_csv: "raw/avt_tags.csv"
    ht_csv: "raw/242000_tags.csv"
    archive: "data.rar"
    lims_xlsx: "ЛИМСы 01.01.2023 - н.в_ (2).xlsx"
    pak_xlsx: "Выгрузка ПАК 01.01.2023 - н.в_.xlsx"
    tags_xlsx: "Теги_хакатон.xlsx"

telemetry:
  freq: "10min"
  start: "2023-01-01 00:00:00"
  end: "2026-08-07 00:00:00"
  # Значения-заглушки «плохого качества» в телеметрии (см. docs/DATA_NOTES.md).
  sentinel_values: [307.0, 313.0]
  # Теги, у которых 307 — легитимное значение, проверить перед использованием: нет таких.
  dead_tags: ["D10"]          # АВТ: плотность нефти, 189207/189217 = 307 → сигнала нет
  suspect_tags: ["F26", "F5", "P44", "P52"]   # >60% отрицательных значений или длинные полки

  # Вердикты по подозрительным тегам. Приняты по данным, а не «на всякий случай»:
  # каждый разобран в docs/RELIABILITY_AGENT.md §8. Тест не даёт молча вернуть
  # в признаки тег со статусом do_not_use.
  tag_verdicts:
    "avt:F5":
      status: do_not_use
      reason: >-
        Описан как расход пара в К-1, но медиана −13.6 и 91 % значений
        отрицательные (доля по обучающему периоду). Расход таким быть не может: либо обратный знак, либо это
        другая величина. До подтверждения технологом не используем.
    "avt:F26":
      status: do_not_use
      reason: >-
        Расход пара в К-6: медиана −3.4, 51 % отрицательных по обучающему
        периоду, 71 тыс. заглушек 307 и полка длиной 440 суток. Сигнала нет.
    "avt:F63":
      status: usable
      reason: >-
        Расход гудрона на битумную установку, медиана 162.9, отрицательных 6.2 % —
        шум около нуля, когда установка не принимает. Годен, отрицательные значения
        маскируются как пропуск.
    "ht:F1":
      status: usable
      reason: >-
        Расход бензина с установки. Отрицательных 5.3 % по всей истории и 4.9 %
        по обучающему периоду, но 97 % из них приходится на остановы: на стоящей
        установке расходомер уходит в небольшой минус. Это не отказ датчика.
        Годен; сами отрицательные значения маскируются как пропуск.
    "avt:D10":
      status: do_not_use
      reason: Плотность нефти — 307 (заглушка) в 189 207 отсчётах из 189 217, сигнала нет.
    "avt:P44":
      status: usable
      reason: >-
        «Вакуум низа К-10» по справочнику КИП. Отрицательные значения (65 %,
        медиана −0.90) — это и есть вакуум, а не брак: эвристика «много
        отрицательных» на вакуумметре даёт ложную тревогу по построению. Тег
        годен и входит в модель качества как один из значимых признаков.
    "avt:P52":
      status: usable
      reason: >-
        «Перепад давления над 4-й пакетной насадкой К-10». Перепад бывает и
        отрицательным, медиана −0.00, отрицательных 65 %. Та же ложная тревога,
        что и у P44. Годен.
  # Порог «замороженного» сигнала: N одинаковых значений подряд (10-мин отсчёты)
  frozen_min_samples: 18       # 3 часа

quality:
  # Целевой показатель товарного ДТ
  target:
    name: "product_sulfur_mgkg"
    lims_source: "Гидроочистка|2|Mg.Sulfur"
    pak_source: "24-2000:Mg.Sulfur"
  # Приоритет источников: ЛИМС → ПАК → ВАК (жёстко задано ТЗ)
  source_priority: ["lims", "pak", "vak"]
  # Доля моментов, в которых системе позволено объявлять тревогу (и, значит,
  # вмешиваться в режим). Задаёт РАБОЧУЮ ТОЧКУ и делает модели сравнимыми: без
  # неё каждая модель выбирает компромисс сама, и та, что кричит вдвое чаще,
  # ловит больше превышений просто поэтому.
  # ДОПУЩЕНИЕ: сколько лишних вмешательств терпимо — решение технолога, в пакете
  # его нет. 0.30 взято по фактической частоте тревог рабочей модели.
  alarm_budget: 0.30
  # Задержка публикации лабораторного анализа. Метка времени в ЛИМС — это момент
  # ОТБОРА ПРОБЫ, а результат появляется в системе позже: транспортировка пробы,
  # само исследование, ввод. Подтверждено организаторами: до 4 часов.
  #
  # Без этой поправки система использует анализ раньше, чем оператор мог его
  # увидеть, — то есть заглядывает в будущее. Поправка применяется ко ВХОДАМ
  # решения и НЕ применяется к факту, с которым сверяются прогоны: превышение
  # случилось в момент отбора, а не публикации.
  lims_publication_delay_hours: 4
  # Через сколько месяцев после конца обучения модель считается устаревшей.
  #
  # Здесь стояло 6, и это была ошибка вывода, а не измерения. Срок считался как
  # «допустимые 0.5 мг/кг поделить на темп смещения 0.076 в месяц» — то есть как
  # время прохождения допуска ОТ НУЛЯ. Но в нуле смещение не начинается:
  # подгонка по пяти окнам даёт bias(возраст) = -0.843 + 0.0762*возраст. На
  # молодой модели прогноз ЗАНИЖЕН на 0.66, с возрастом смещение идёт вверх,
  # проходит ноль около 11 месяцев и только потом уходит в плюс. По модулю оно
  # сначала УБЫВАЕТ: 0.660 на полутора месяцах против 0.089 на двенадцати с
  # половиной.
  #
  # Из-за пропущенного пересечения карточка оператора резала уверенность сильнее
  # всего ровно там, где измеренное смещение наименьшее: на возрасте 12.6 мес
  # множитель был 0.476 при фактическом смещении +0.089.
  #
  # Новое число — КРАЙ ИЗМЕРЕННОГО, а не экстраполяция. Дрейф проверен до 12.6
  # месяцев, и на всём этом промежутке качество решений не ухудшается: MAE
  # +0.0033/мес (ранговая корреляция +0.10, p=0.87), ROC-AUC +0.014/мес (+0.30,
  # p=0.62). Значит уверенность должна падать от НЕЗНАНИЯ за краем проверенного,
  # а не от измеренной порчи внутри него. Берём 12 — с запасом внутрь.
  #
  # Экстраполяция обещала бы 17.6 месяца (выход |смещения| за 0.5), а по другому
  # критерию — исчезновению выигрыша у персистенции — 28 месяцев. Оба дальше, чем
  # 12, и оба за пределами проверенного. Поэтому не они.
  model_shelf_life_months: 12
  # Возраст анализа, после которого значение считается устаревшим
  staleness_hours:
    lims: 24
    pak: 1
    # Сера СЫРЬЯ анализируется по другому расписанию, и порог продукта ей не
    # подходит: медиана промежутка 48 ч, 90-й процентиль 715 ч. Порог взят как
    # 95-й процентиль промежутков ОБУЧАЮЩЕГО периода — флаг означает «лаборатория
    # молчит дольше обычного», а не «наступил очередной день без анализа».
    # Обоснование и цена устаревания — docs/QUALITY_AGENT.md.
    lims_feed: 744
  # Порог обрезки лабораторных выбросов (мг/кг). Всё выше — карантин, не факт.
  lims_sulfur_outlier_above: 50.0

# Исправленные формулы виртуальных анализаторов. Лист «ВАК» в выданном файле
# содержит ошибки: часть формул даёт физически невозможные значения (T90 —
# 198 000 °C). Исправления получены ОТ ОРГАНИЗАТОРОВ в ответах на вопросы, и
# записаны здесь, а не правкой исходного файла: источник поправки должен быть
# виден, а сам файл остаётся тем, что выдали.
vak:
  corrections:
    "24-2000:GODT:T90":
      formula: "162.998+0.12945*T12+59.57*(F15/2000)+0.00036*W7+0.26366*T23-424.72638*F1/F26"
      reason: "в выданной формуле F15 без деления на 2000; ответ организаторов"
    "24-2000:GODT:T50":
      formula: "44.625+10.0224*P13+0.06981*F9+0.471*T6"
      reason: "формула заменена целиком; ответ организаторов"
    "24-2000:GODT:CloudPoint":
      formula: >-
        0.0002*F22+0.0021*W7+0.00008*F25-0.30656*F1+0.12018*T6+0.01916*F9
        -48.254-0.05249*T16+0.00011
      reason: "формула заменена целиком; ответ организаторов"
    "24-2000:GODT:CFPP":
      formula: "0.22088*T23-102.375-47.75834*P8+0.03862*F9+43.60207*W7+43.81849*P24"
      reason: "формула заменена целиком; ответ организаторов"
    "24-2000:GODT:T95":
      formula: "0.03814*F9-9.201-0.00002*F2+0.50*T6+0.48321*LIMS_T95"
      reason: "формула заменена целиком; ответ организаторов"
    "AVT6:240-350:CFPP":
      formula: "31.40363-0.06784*T33+17.411*P67-8.11544*P4-0.47309*(F65/F32+F30)"
      reason: "лишняя закрывающая скобка в выданной формуле; ответ организаторов"

  # Поправки, которых организаторы НЕ давали: наше прочтение записи, подтверждённое
  # лабораторией. Держатся ОТДЕЛЬНЫМ ключом намеренно — источник поправки должен
  # быть виден в отчёте, и «прислано заказчиком» не должно смешиваться с «вывели
  # сами». Каждая обязана нести измеримое свидетельство, а не догадку.
  proposed_corrections:
    "AVT6:240-350:CFPP":
      formula: "31.40363-0.06784*T33+17.411*P67-8.11544*P4-0.47309*(F65/(F32+F30))"
      reason: >-
        Поправка организаторов убрала скобку так, что к температуре в °C
        прибавляется расход F30 в т/ч: медиана −68.9 °C, в физический диапазон
        не попадает ни одно значение. В соседней ячейке того же блока (D15)
        отношение расходов записано как F30/(F32+F30) — по этой аналогии
        последнее слагаемое читается как F65/(F32+F30). В таком виде формула
        воспроизводит ПТФ по точке АВТ|3: смещение +1.7 °C, MAE 2.3 °C
        на 80 анализах.
      source: "разбор по данным, участник 2; организаторами НЕ подтверждено"
      assumption: true
    "AVT6:350:I350":
      formula: "399.562-1.62865*L43-0.76664*T6-0.22361*T18+0.00031*F64*(T15-T11)"
      reason: >-
        Сумма слагаемых без свободного члена равна −306.9 %, поэтому с
        константой 39.562 формула даёт −265 % отгона. Для лабораторных 93 %
        константа должна быть 399.9 — то есть у выданной потеряна первая цифра.
        С 399.562 смещение +2.7 %, MAE 5.4 на 116 анализах. ВАЖНО: уровень
        становится верным, а корреляция остаётся нулевой (−0.06) — виртуальным
        анализатором отгона формула не станет и после правки.
      source: "разбор по данным, участник 2; организаторами НЕ подтверждено"
      assumption: true

spec:
  # Жёсткие ограничения. Источник указан у каждого.
  product_sulfur_mgkg:
    max: 10.0
    source: "ТЗ, п.4 «Минимальные жёсткие проверки»"
    assumption: false
  blend_fractions_sum:
    value: 1.0
    tolerance: 1.0e-6
    source: "ТЗ, п.4"
    assumption: false
  flash_point_c:
    min: 55.0
    source: "EN 590 / ГОСТ 32511 — в пакете спецификация не выдана"
    assumption: true
  t95_c:
    max: 360.0
    source: "EN 590"
    assumption: true
  density_15c_kgm3:
    min: 820.0
    max: 845.0
    source: "EN 590"
    assumption: true
  cfpp_c:
    max: -5.0
    source: "сорт F (зимний), сезонность не выдана"
    assumption: true
  # Третий обязательный показатель по ответу организаторов (сера, Т95, ЦЧ).
  # На выданных данных он падает: 55.9 (2023) → 52.3 (2026), последний анализ
  # 50.0 при нормативе 51 — то есть норматив уже нарушен. Разбор:
  # scripts/check_cetane.py, docs/BLENDING.md.
  cetane_number:
    min: 51.0
    source: "EN 590 / ГОСТ 32511 — спецификация в пакете не выдана"
    assumption: true

# Экономика. Цен в пакете нет, кроме ОДНОЙ: организаторы назвали цену
# цетаноповышающей присадки — в 100 раз выше дизеля за тонну, дозировка до 3 %.
# Поэтому экономика считается в ОТНОСИТЕЛЬНЫХ единицах: цена тонны дизеля = 1.
economics:
  diesel_price: 1.0
  cetane_improver:
    price_ratio: 100.0
    max_pct: 3.0
    source: "ответ организаторов"
    assumption: false

limits:
  # Рабочие диапазоны управляющих воздействий НЕ выданы в пакете.
  # Используем консервативный модельный диапазон = [p05, p95] истории,
  # плюс ограничение на скорость изменения за один цикл. Это ДОПУЩЕНИЕ.
  mode: "historical_quantile"
  quantiles: [0.05, 0.95]
  assumption: true
  max_step_per_cycle:      # максимальное изменение за один цикл рекомендации
    temperature_c: 2.0
    pressure_mpa: 0.05
    flow_rel: 0.03         # 3% от текущего значения
  # Как часто система ВЫДАЁТ рекомендацию. Организаторы назвали 15 минут — 1 час;
  # берём час, потому что признаки строятся на часовой сетке.
  recommendation_interval_hours: 1.0
  # Как часто уставке разрешено ДВИГАТЬСЯ. Это не то же самое, и разница
  # принципиальна: считать можно хоть каждую минуту, а двигать уставку раньше, чем
  # подействовала предыдущая правка, нельзя — иначе система гоняется за собственным
  # ещё не проявившимся воздействием.
  #
  # Число опирается на ИЗМЕРЕНИЕ, а не на вкус: постоянная времени канала серы
  # 4.6 ч (scripts/find_delays.py, reports/delays.json). За 4 часа отклик проходит
  # около 58% пути к новому уровню — большая часть эффекта уже видна, а ждать
  # полного успокоения (3τ ≈ 14 ч) значит терять управляемость.
  #
  # Вместе с max_step_per_cycle это задаёт предельную СКОРОСТЬ изменения режима:
  # 2 °C за 4 часа = 0.5 °C/ч. Организаторы ответили, что ограничений на скорость
  # изменения в пакете нет, то есть выбор наш — и он должен быть виден здесь, а не
  # спрятан в значении аргумента по умолчанию.
  min_hours_between_actions: 4.0
  # Возврат к базовому режиму — не раньше, чем проявился эффект последнего
  # действия ради качества: 3τ ≈ 14 ч, 95 % отклика. Для НОВОГО действия ждать
  # полного успокоения нельзя (см. выше), а для необязательного возврата — нужно:
  # без паузы имитация возвращала сырьё через 4 часа после среза, когда сера
  # сместилась лишь наполовину, и через несколько часов режим срезали снова.
  return_settle_hours: 14.0
  # Возврат к базовому режиму реализован и измерен, но ВЫКЛЮЧЕН: на окне
  # валидационного периода он возвращает выпуск и снимает перегрев, но треть
  # возвратов отменяется в течение суток, а на тестовом окне с остановом установки
  # добавился шаг с превышением серы. Числа — scripts/check_return_to_base.py,
  # разбор — docs/OPTIMIZER_AGENT.md. Включение — осознанное решение, не умолчание.
  return_to_base: false
  # Повтор действия, пока прошлое ещё проявляется (в пределах return_settle_hours),
  # разрешён только при росте риска не меньше этой величины; null — правила нет.
  # Правило приёмки — docs/PLAN.md, подбор на валидационном периоде.
  repeat_min_risk_increase: null
  assumption_note: "Промышленные уставки не выданы; исторический min/max не выдаётся за предел."

controls:
  # Управляемые переменные. Для АВТ — по трём листам схем с кодами тегов (14.09) и
  # справочнику КИП, разбор — docs/AVT_SCHEMES.md §3. В цикле решений теги АВТ
  # рычагами не служат: оптимизатор двигает только уставки гидроочистки, так что
  # этот список — обоснованный перечень, а не то, чем система управляет.
  #
  # До схем здесь стояли T55, T1, T20, P22, F29, F30, F32. F29 (пар в К-2) ни на
  # схеме, ни в КИП управляемым не отмечен и убран. T1, T20, T55 на схеме не
  # выделены, но в КИП у них «Выход на FIRC…» — это регуляторы температуры, чью
  # уставку и задаёт оператор. Единицы расходов не записаны: W70/F30 = 0.78
  # показывает, что объёмные расходомеры АВТ пишут объём в условиях потока, а
  # F65 расходится с F7+F8+F9 множителем 1.255 (docs/AVT_SCHEMES.md §2).
  # Двойники на одном трубопроводе даны по одному, лучшим прибором из пары.
  avt:
    # К-1
    - {tag: "P2",  name: "Давление бензиновых паров верха К-1", source: "схема"}
    - {tag: "T6",  name: "Температура низа К-1", unit: "°C", source: "схема"}
    - {tag: "T1",  name: "Температура верха К-1", unit: "°C", source: "КИП: регулятор, выход на орошение F3"}
    # К-2
    - {tag: "P22", name: "Давление верха К-2", unit: "кгс/см2", source: "схема"}
    - {tag: "T20", name: "Температура верха К-2", unit: "°C", source: "КИП: регулятор, выход на острое орошение F19"}
