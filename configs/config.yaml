# Единая конфигурация проекта. Всё, что является ДОПУЩЕНИЕМ (не подтверждено
# выданными материалами), помечено ключом assumption: true — этого требует ТЗ.

paths:
  # Папка с исходной выдачей (xlsx, data.rar). Переопределяется NEFTE_SOURCE_DIR.
  # Относительный путь считается от корня решения: по умолчанию — data/ рядом с кодом.
  source_dir: "data"
  # Локальный кэш (распакованные csv + parquet, ~1.3 ГБ). Переопределяется
  # NEFTE_DATA_DIR; держать вне облачной синхронизации.
  data_dir: "data/cache"
  files:
    avt_csv: "raw/avt_tags.csv"
    ht_csv: "raw/242000_tags.csv"
    archive: "data.rar"
    lims_xlsx: "ЛИМСы 01.01.2023 - н.в_ (2).xlsx"
    pak_xlsx: "Выгрузка ПАК 01.01.2023 - н.в_.xlsx"
    tags_xlsx: "Теги_хакатон.xlsx"

telemetry:
  freq: "10min"
  start: "2023-01-01 00:00:00"
  end: "2026-08-07 00:00:00"
  # Значения-заглушки «плохого качества» в телеметрии (см. docs/DATA_NOTES.md).
  sentinel_values: [307.0, 313.0]
  # Теги, у которых 307 — легитимное значение, проверить перед использованием: нет таких.
  dead_tags: ["D10"]          # АВТ: плотность нефти, 189207/189217 = 307 → сигнала нет
  suspect_tags: ["F26", "F5", "P44", "P52"]   # >60% отрицательных значений или длинные полки

  # Вердикты по подозрительным тегам. Приняты по данным, а не «на всякий случай»:
  # каждый разобран в docs/RELIABILITY_AGENT.md §8. Тест не даёт молча вернуть
  # в признаки тег со статусом do_not_use.
  tag_verdicts:
    "avt:F5":
      status: do_not_use
      reason: >-
        Описан как расход пара в К-1, но медиана −13.6 и 91 % значений
        отрицательные (доля по обучающему периоду). Расход таким быть не может: либо обратный знак, либо это
        другая величина. До подтверждения технологом не используем.
    "avt:F26":
      status: do_not_use
      reason: >-
        Расход пара в К-6: медиана −3.4, 51 % отрицательных по обучающему
        периоду, 71 тыс. заглушек 307 и полка длиной 440 суток. Сигнала нет.
    "avt:F63":
      status: usable
      reason: >-
        Расход гудрона на битумную установку, медиана 162.9, отрицательных 6.2 % —
        шум около нуля, когда установка не принимает. Годен, отрицательные значения
        маскируются как пропуск.
    "ht:F1":
      status: usable
      reason: >-
        Расход бензина с установки. Отрицательных 5.3 % по всей истории и 4.9 %
        по обучающему периоду, но 97 % из них приходится на остановы: на стоящей
        установке расходомер уходит в небольшой минус. Это не отказ датчика.
        Годен; сами отрицательные значения маскируются как пропуск.
    "avt:D10":
      status: do_not_use
      reason: Плотность нефти — 307 (заглушка) в 189 207 отсчётах из 189 217, сигнала нет.
    "avt:P44":
      status: usable
      reason: >-
        «Вакуум низа К-10» по справочнику КИП. Отрицательные значения (65 %,
        медиана −0.90) — это и есть вакуум, а не брак: эвристика «много
        отрицательных» на вакуумметре даёт ложную тревогу по построению. Тег
        годен и входит в модель качества как один из значимых признаков.
    "avt:P52":
      status: usable
      reason: >-
        «Перепад давления над 4-й пакетной насадкой К-10». Перепад бывает и
        отрицательным, медиана −0.00, отрицательных 65 %. Та же ложная тревога,
        что и у P44. Годен.
  # Порог «замороженного» сигнала: N одинаковых значений подряд (10-мин отсчёты)
  frozen_min_samples: 18       # 3 часа

quality:
  # Целевой показатель товарного ДТ
  target:
    name: "product_sulfur_mgkg"
    lims_source: "Гидроочистка|2|Mg.Sulfur"
    pak_source: "24-2000:Mg.Sulfur"
  # Приоритет источников: ЛИМС → ПАК → ВАК (жёстко задано ТЗ)
  source_priority: ["lims", "pak", "vak"]
  # Доля моментов, в которых системе позволено объявлять тревогу (и, значит,
  # вмешиваться в режим). Задаёт РАБОЧУЮ ТОЧКУ и делает модели сравнимыми: без
  # неё каждая модель выбирает компромисс сама, и та, что кричит вдвое чаще,
  # ловит больше превышений просто поэтому.
  # ДОПУЩЕНИЕ: сколько лишних вмешательств терпимо — решение технолога, в пакете
  # его нет. 0.30 взято по фактической частоте тревог рабочей модели.
  alarm_budget: 0.30
  # Задержка публикации лабораторного анализа. Метка времени в ЛИМС — это момент
  # ОТБОРА ПРОБЫ, а результат появляется в системе позже: транспортировка пробы,
  # само исследование, ввод. Подтверждено организаторами: до 4 часов.
  #
  # Без этой поправки система использует анализ раньше, чем оператор мог его
  # увидеть, — то есть заглядывает в будущее. Поправка применяется ко ВХОДАМ
  # решения и НЕ применяется к факту, с которым сверяются прогоны: превышение
  # случилось в момент отбора, а не публикации.
  lims_publication_delay_hours: 4
  # Через сколько месяцев после конца обучения модель считается устаревшей.
  #
  # Здесь стояло 6, и это была ошибка вывода, а не измерения. Срок считался как
  # «допустимые 0.5 мг/кг поделить на темп смещения 0.076 в месяц» — то есть как
  # время прохождения допуска ОТ НУЛЯ. Но в нуле смещение не начинается:
  # подгонка по пяти окнам даёт bias(возраст) = -0.843 + 0.0762*возраст. На
  # молодой модели прогноз ЗАНИЖЕН на 0.66, с возрастом смещение идёт вверх,
  # проходит ноль около 11 месяцев и только потом уходит в плюс. По модулю оно
  # сначала УБЫВАЕТ: 0.660 на полутора месяцах против 0.089 на двенадцати с
  # половиной.
  #
  # Из-за пропущенного пересечения карточка оператора резала уверенность сильнее
  # всего ровно там, где измеренное смещение наименьшее: на возрасте 12.6 мес
  # множитель был 0.476 при фактическом смещении +0.089.
  #
  # Новое число — КРАЙ ИЗМЕРЕННОГО, а не экстраполяция. Дрейф проверен до 12.6
  # месяцев, и на всём этом промежутке качество решений не ухудшается: MAE
  # +0.0033/мес (ранговая корреляция +0.10, p=0.87), ROC-AUC +0.014/мес (+0.30,
  # p=0.62). Значит уверенность должна падать от НЕЗНАНИЯ за краем проверенного,
  # а не от измеренной порчи внутри него. Берём 12 — с запасом внутрь.
  #
  # Экстраполяция обещала бы 17.6 месяца (выход |смещения| за 0.5), а по другому
  # критерию — исчезновению выигрыша у персистенции — 28 месяцев. Оба дальше, чем
  # 12, и оба за пределами проверенного. Поэтому не они.
  model_shelf_life_months: 12
  # Возраст анализа, после которого значение считается устаревшим
  staleness_hours:
    lims: 24
    pak: 1
    # Сера СЫРЬЯ анализируется по другому расписанию, и порог продукта ей не
    # подходит: медиана промежутка 48 ч, 90-й процентиль 715 ч. Порог взят как
    # 95-й процентиль промежутков ОБУЧАЮЩЕГО периода — флаг означает «лаборатория
    # молчит дольше обычного», а не «наступил очередной день без анализа».
    # Обоснование и цена устаревания — docs/QUALITY_AGENT.md.
    lims_feed: 744
  # Какой поточный анализатор серы считать оперативным источником:
  #   pak — ряд из файла анализаторов (как было);
  #   q21 — тег Q21 из телеметрии 24-2000 («поточный анализатор серы в г/о ДТ»,
  #         таблица организаторов 15.09).
  # Это ДВА РАЗНЫХ прибора, а не копия: между собой они связаны слабо (corr 0.41),
  # а с лабораторией Q21 сходится заметно лучше (docs/DATA_NOTES.md §5б).
  # Выбран q21 по цене ошибок на валидации (scripts/check_analyzer_source.py,
  # правило и обе его редакции — docs/PLAN.md): пропущенная некондиция стоит в
  # 50–100 раз дороже лишней проверки (ответ 15.09), и при K = 50 цена ошибок у
  # Q21 равна 1317 против 1902 у файла ПАК. По сырым числам валидации: MAE 1.28
  # против 1.86, corr 0.66 против −0.04, полнота факта 0.40 против 0.12 при доле
  # ложных превышений 0.09 против 0.01.
  analyzer_source: q21
  # Расхождение двух поточных анализаторов (файл ПАК и Q21), выше которого карточка
  # предупреждает о недостоверности, мг/кг. Выбран правилом, записанным до счёта
  # (scripts/check_analyzer_disagreement.py): наименьший порог сетки, при котором
  # ошибка оперативного значения хотя бы вдвое больше — на валидации 3.06 против
  # 1.03, на тесте 4.89 против 1.04. На РЕШЕНИЯ не влияет: как причина отказа он
  # прошёл правило лишь на одном пороге из четырёх (scripts/check_disagreement_decisions.py).
  analyzer_disagreement_mgkg: 2.0
  # Уровень Т95 в проверке ЖЁСТКОГО ограничения оптимизатора: last — последний
  # анализ (как было), last_plus_sigma — плюс σ ухода показателя с момента отбора.
  # В прогноз и риск Т95 не идёт. Правило — docs/PLAN.md («Т95…»), проверка —
  # scripts/check_t95_conservative.py. Включено 21.09 по правилу: на валидации
  # условия выполнены равенствами — решений там не изменило (Т95 далеко от предела),
  # это страховка для моментов, когда Т95 у предела (reports/t95_conservative.json).
  t95_estimate: last_plus_sigma
  # Допуск детектора полки Q21, мг/кг: прибор «уже не меняется», если размах
  # последних frozen_min_samples отсчётов меньше допуска. Q21 уходит в неисправность
  # на 24.88 ± 0.04, и точное равенство (прежний детектор, null) не видело полку
  # вовсе. Правило до счёта — scripts/check_q21_shelf.py: на обучении 93.5 % полки
  # при 0.13 % ложных на работающей установке, на тесте 98.9 % полки (было 0 %).
  q21_frozen_tolerance_mgkg: 0.05
  # Порог обрезки лабораторных выбросов (мг/кг). Всё выше — карантин, не факт.
  lims_sulfur_outlier_above: 50.0

# Исправленные формулы виртуальных анализаторов. Лист «ВАК» в выданном файле
# содержит ошибки: часть формул даёт физически невозможные значения (T90 —
# 198 000 °C). Исправления получены ОТ ОРГАНИЗАТОРОВ в ответах на вопросы, и
# записаны здесь, а не правкой исходного файла: источник поправки должен быть
# виден, а сам файл остаётся тем, что выдали.
vak:
  corrections:
    "24-2000:GODT:T90":
      formula: "162.998+0.12945*T12+59.57*(F15/2000)+0.00036*W7+0.26366*T23-424.72638*F1/F26"
      reason: "в выданной формуле F15 без деления на 2000; ответ организаторов"
    "24-2000:GODT:T50":
      formula: "44.625+10.0224*P13+0.06981*F9+0.471*T6"
      reason: "формула заменена целиком; ответ организаторов"
    "24-2000:GODT:CloudPoint":
      formula: >-
        0.0002*F22+0.0021*W7+0.00008*F25-0.30656*F1+0.12018*T6+0.01916*F9
        -48.254-0.05249*T16+0.00011
      reason: "формула заменена целиком; ответ организаторов"
    "24-2000:GODT:CFPP":
      formula: "0.22088*T23-102.375-47.75834*P8+0.03862*F9+43.60207*W7+43.81849*P24"
      reason: "формула заменена целиком; ответ организаторов"
    "24-2000:GODT:T95":
      formula: "0.03814*F9-9.201-0.00002*F2+0.50*T6+0.48321*LIMS_T95"
      reason: "формула заменена целиком; ответ организаторов"
    # Четыре формулы АВТ — по официальной таблице «формулы_ВАК.xlsx» (15.09), где
    # организаторы привели все 17 формул с примерами расчёта. Остальные 13 в ней
    # совпадают с тем, что уже считалось. Таблица — configs/vak_official_2026-09-15.csv,
    # равенство всех 17 рабочих формул официальным — tests/test_vak_official.py.
    "AVT6:240-350:CFPP":
      formula: "31.40363-0.06784*T33+17.411*P67-8.11544*P4-0.47309*F65/(F32+F30)"
      reason: >-
        официальная таблица организаторов 15.09. Совпала с прочтением участника 2 (F65/(F32+F30)),
        а первая присланная поправка «(F65/F32+F30)» прибавляла к температуре расход.
        По точке АВТ|3: смещение +1.65 °C, MAE 2.31 на 80 анализах
    "AVT6:240-350:D15":
      formula: "791.22872-5.30294*(F65/(F32+F30))+0.52755*T66-0.15629*T33"
      reason: >-
        официальная таблица организаторов 15.09: в пакете F30/(F32+F30), в таблице F65/(F32+F30).
        По точке АВТ|3 смещение +3.4 кг/м3 вместо +23.8, MAE 4.6
    "AVT6:350:T50":
      formula: "493.6798+1.281193*T42-0.955342*T48-0.018454*F31+0.265904*F57-0.082047*T66-0.545083*T33"
      reason: >-
        официальная таблица организаторов 15.09: формула новая. В пакете в этой ячейке стоял дубль
        формулы плотности 350 (разность с D15 — константа 2.027). По точке АВТ|1:
        смещение 0.0 °C, MAE 4.8, corr 0.52 на 648 анализах
    "AVT6:350:I350":
      formula: "39.562-1.62865*L43+0.76664*T6-0.22361*T18+0.00031*F64*(T15-T11)"
      reason: >-
        официальная таблица организаторов 15.09: ошибка пакета была в знаке при T6, а не в
        константе. По точке АВТ|1: смещение −7.6 %, MAE 9.2, corr 0.08 на 116
        анализах — уровень физический, связи с лабораторией нет

  # Поправки, которых организаторы НЕ давали: наше прочтение записи, подтверждённое
  # лабораторией. Держатся ОТДЕЛЬНЫМ ключом намеренно — источник поправки должен
  # быть виден в отчёте, и «прислано заказчиком» не должно смешиваться с «вывели
  # сами». Каждая обязана нести измеримое свидетельство, а не догадку.
  #
  # После официальной таблицы 15.09 действующих прочтений нет: оба сверены с ней.
  proposed_corrections: {}

  # Прочтения, закрытые официальной таблицей 15.09. В расчёт не идут, хранятся как
  # проверяемая история: одно подтвердилось, другое — нет, и это надо уметь показать.
  superseded_proposals:
    "AVT6:240-350:CFPP":
      formula: "31.40363-0.06784*T33+17.411*P67-8.11544*P4-0.47309*(F65/(F32+F30))"
      verdict: "подтверждено: совпадает с официальной формулой"
      first_organizer_answer: "31.40363-0.06784*T33+17.411*P67-8.11544*P4-0.47309*(F65/F32+F30)"
      source: "разбор по данным, участник 2"
    "AVT6:350:I350":
      formula: "399.562-1.62865*L43-0.76664*T6-0.22361*T18+0.00031*F64*(T15-T11)"
      verdict: >-
        не подтверждено: у организаторов константа прежняя (39.562), а знак при T6 —
        плюс. Уровень наше прочтение восстанавливало (смещение +2.7 %), причину — нет
      source: "разбор по данным, участник 2"

spec:
  # Жёсткие ограничения. Источник указан у каждого.
  product_sulfur_mgkg:
    max: 10.0
    source: "ТЗ, п.4 «Минимальные жёсткие проверки»"
    assumption: false
  blend_fractions_sum:
    value: 1.0
    tolerance: 1.0e-6
    source: "ТЗ, п.4"
    assumption: false
  flash_point_c:
    min: 55.0
    source: "EN 590 / ГОСТ 32511 — в пакете спецификация не выдана"
    assumption: true
  t95_c:
    max: 360.0
    source: "EN 590"
    assumption: true
  # Плотность и цетановое число — по марке ДТ (ответ организаторов 15.09). Здесь
  # записана марка, которую получает блок смешения (blend_grade), значения других
  # марок — в grades; равенство проверяет tests/test_product_grades.py.
  density_15c_kgm3:
    min: 820.0
    max: 845.0
    source: "ответ организаторов 15.09: ДТ летнее товарное (и ДТ с гидроочистки)"
    assumption: false
  cfpp_c:
    max: -5.0
    source: "сорт F (зимний), сезонность не выдана"
    assumption: true
  # Третий обязательный показатель по ответу организаторов (сера, Т95, ЦЧ).
  # Норматив — у ТОВАРНОГО топлива: у ДТ с гидроочистки ЦЧ не нормируется, у летнего
  # товарного не ниже 51, у зимнего — не ниже 49 (ответ 15.09). Лаборатория меряет
  # ЦЧ в точке «Гидроочистка, 2», то есть у полупродукта: 55.9 (2023) → 52.3 (2026),
  # последний анализ 50.0. Нарушением норматива это не является; это значит, что
  # летнюю марку из одного ГО ДТ без присадки или другого компонента уже не получить,
  # а для зимней остаётся запас в одну единицу. scripts/check_cetane.py, docs/BLENDING.md.
  cetane_number:
    min: 51.0
    source: "ответ организаторов 15.09: ДТ летнее товарное"
    assumption: false
  grades:
    hydrotreated:
      name: "ДТ с гидроочистки"
      density_15c_kgm3: [820.0, 845.0]
      cetane_number_min: null
    summer:
      name: "ДТ летнее товарное"
      density_15c_kgm3: [820.0, 845.0]
      cetane_number_min: 51.0
    winter:
      name: "ДТ зимнее товарное"
      density_15c_kgm3: [800.0, 845.0]
      cetane_number_min: 49.0
  # Какую марку получает блок смешения. Сезон в пакете не задан; летняя строже по ЦЧ
  # и по нижней границе плотности, поэтому по умолчанию — она.
  blend_grade: summer

# Экономика. Цен в пакете нет, кроме ОДНОЙ: организаторы назвали цену
# цетаноповышающей присадки — в 100 раз выше дизеля за тонну, дозировка до 3 %.
# Поэтому экономика считается в ОТНОСИТЕЛЬНЫХ единицах: цена тонны дизеля = 1.
blending:
  # Гашение превышения в резервуаре — практика установки, названная технологом на
  # сессии 11.09 (docs/transcripts/qa_2026-09-11.txt, 30:26): «если видят, что идёт
  # гидроочищенное ДТ с превышением 10 ppm, оно поступает в резервуар, оценивается,
  # насколько в резервуаре будет превышение, и это топливо смешивается уже с другим
  # топливом в другом резервуаре, в котором есть значительный запас по сере».
  # Пример оттуда же: партию с 11 мг/кг гасят резервуарами с 7–8.
  #
  # Данных по резервуарам в пакете нет, поэтому сера товарного резервуара — ДОПУЩЕНИЕ
  # из этого примера. Число входит только в подсказку оператору «какую долю партии
  # можно принять», на выбор режима оно не влияет.
  tank_reserve_sulfur_mgkg: 7.5
  tank_reserve_assumption: true
  # Запас, с которым смесь должна уйти под предел: технологический запас установки
  # по ответу 15.09 (05:59) — 1–2 мг/кг, берём нижнюю границу.
  tank_rescue_margin_mgkg: 1.0

economics:
  diesel_price: 1.0
  cetane_improver:
    price_ratio: 100.0
    max_pct: 3.0
    source: "ответ организаторов"
    assumption: false

limits:
  # Рабочие диапазоны управляющих воздействий НЕ выданы в пакете.
  # Используем консервативный модельный диапазон = [p05, p95] истории,
  # плюс ограничение на скорость изменения за один цикл. Это ДОПУЩЕНИЕ.
  mode: "historical_quantile"
  quantiles: [0.05, 0.95]
  assumption: true
  max_step_per_cycle:      # максимальное изменение за один цикл рекомендации
    temperature_c: 2.0
    pressure_mpa: 0.05
    flow_rel: 0.03         # 3% от текущего значения
  # Как часто система ВЫДАЁТ рекомендацию. Организаторы назвали 15 минут — 1 час;
  # берём час, потому что признаки строятся на часовой сетке.
  recommendation_interval_hours: 1.0
  # Как часто уставке разрешено ДВИГАТЬСЯ. Это не то же самое, и разница
  # принципиальна: считать можно хоть каждую минуту, а двигать уставку раньше, чем
  # подействовала предыдущая правка, нельзя — иначе система гоняется за собственным
  # ещё не проявившимся воздействием.
  #
  # Число опирается на ИЗМЕРЕНИЕ, а не на вкус: постоянная времени канала серы
  # 4.6 ч (scripts/find_delays.py, reports/delays.json). За 4 часа отклик проходит
  # около 58% пути к новому уровню — большая часть эффекта уже видна, а ждать
  # полного успокоения (3τ ≈ 14 ч) значит терять управляемость.
  #
  # Вместе с max_step_per_cycle это задаёт предельную СКОРОСТЬ изменения режима:
  # 2 °C за 4 часа = 0.5 °C/ч. Организаторы ответили, что ограничений на скорость
  # изменения в пакете нет, то есть выбор наш — и он должен быть виден здесь, а не
  # спрятан в значении аргумента по умолчанию.
  min_hours_between_actions: 4.0
  # Возврат к базовому режиму — не раньше, чем проявился эффект последнего
  # действия ради качества: 3τ ≈ 14 ч, 95 % отклика. Для НОВОГО действия ждать
  # полного успокоения нельзя (см. выше), а для необязательного возврата — нужно:
  # без паузы имитация возвращала сырьё через 4 часа после среза, когда сера
  # сместилась лишь наполовину, и через несколько часов режим срезали снова.
  return_settle_hours: 14.0
  # Возврат к базовому режиму реализован и измерен, но ВЫКЛЮЧЕН: на окне
  # валидационного периода он возвращает выпуск и снимает перегрев, но треть
  # возвратов отменяется в течение суток, а на тестовом окне с остановом установки
  # добавился шаг с превышением серы. Числа — scripts/check_return_to_base.py,
  # разбор — docs/OPTIMIZER_AGENT.md. Включение — осознанное решение, не умолчание.
  return_to_base: false
  # Повтор действия, пока прошлое ещё проявляется (в пределах return_settle_hours),
  # разрешён только при росте риска не меньше этой величины; null — правила нет.
  # Правило приёмки — docs/PLAN.md, подбор на валидационном периоде.
  repeat_min_risk_increase: null
  assumption_note: "Промышленные уставки не выданы; исторический min/max не выдаётся за предел."

reliability:
  # Как агент надёжности судит об износе катализатора. Прежнее поведение —
  # age + outage_48h; правило, по которому их включать, записано
  # в docs/PLAN.md ДО счёта, сравнение — scripts/check_catalyst_factor.py.
  #
  # catalyst_factor: age — наработка с последнего сброса, activity — уровень WABT,
  #   приведённой к нагрузке, за 30 суток (models/catalyst.activity_level_series).
  #
  # ПЕРЕСМОТРЕНО 18.09 по тому же правилу, записанному до счёта. На матрице 8 и
  # итоговом коде (исправленная калибровка риска, выключенный перепад Р-202)
  # вариант «активность» правило больше НЕ проходит: в имитации окна плохих
  # данных он даёт 2 вмешательства против 0 у прежнего варианта. Проходит «б» —
  # возраст с обнулением по журналу замен, его отчёт и называет решением
  # (reports/catalyst_factor.json → «решение»). Менять правило под прежний выбор
  # мы не стали: оно было записано заранее и применяется как есть.
  catalyst_factor: age
  # Входит ли перепад давления Р-202 (P8) в тяжесть режима с весом 0.20.
  # off — не входит (по умолчанию), level — нормированный уровень P8, как было.
  #
  # ИЗМЕРЕННЫЙ ОТКАЗ, разбор — docs/DP_PROXY.md (участник 2) и docs/PLAN.md.
  # Внутри цикла при той же нагрузке P8 растёт на 0.005 МПа за два года (2.5 %
  # уровня), после загрузки свежего катализатора не падает, а прыгает вверх, и на
  # 70 % объясняется расходом сырья. Включённый уровнем, он переводит 18 % моментов
  # теста в тяжёлый класс (с прежним ошибочным тегом W10 было 0.1 %), а тяжёлый
  # класс запрещает поднимать температуру реакторов: отказов «нет допустимых
  # вариантов» на тесте 81 против 11 без фактора, вмешательств 75 против 101.
  # growth — прирост P8 от начала цикла при той же нагрузке (участник 2,
  # models/catalyst.dp_growth_series). ВТОРОЙ ИЗМЕРЕННЫЙ ОТКАЗ по правилу, записанному
  # до счёта: на валидации тяжёлый класс 24 % (нужно ≤ 5 %), отказов «нет допустимых
  # вариантов» 1068 против 7 — прирост ловит усадку свежей загрузки, а не износ
  # (docs/DP_PROXY.md §3). Без допустимого перепада от организаторов шкалы нет.
  dp_factor: "off"
  # Что вычёркивает высокий класс тяжести режима: all — все варианты (как было),
  # raise_only — только те, что тяжесть повышают или поднимают температуру. В конце
  # цикла катализатора «all» давал неделями «нет допустимых вариантов» при низком
  # риске (docs/PLAN.md, «Конец цикла катализатора»); правило приёмки — там же, до
  # счёта, проверка — scripts/check_severity_veto.py. Включено 21.09: все четыре
  # условия; на валидации отказов «нет допустимых вариантов» 119 → 4, пропуски не
  # выросли, действий при высокой тяжести с подъёмом температуры нет
  # (reports/severity_veto.json).
  severity_veto: raise_only
  # catalyst_reset: outage_48h — сброс на любом останове дольше 48 ч; catalyst_log —
  #   только на заменах из catalyst_changes. Из трёх длительных остановов истории
  #   заменами были два (docs/CATALYST_LIFE.md §1). Включён catalyst_log — часть
  #   принятого варианта «б», см. комментарий к catalyst_factor.
  catalyst_reset: catalyst_log
  # Журнал замен катализатора: пуски после замены. ДОПУЩЕНИЕ: в пакете журнала нет,
  # даты восстановлены по шагу нормированной температуры через останов
  # (scripts/check_catalyst_life.py). На установке их знают из журнала ремонтов.
  catalyst_changes: ["2024-04-17 15:00", "2026-04-23 11:20"]
  catalyst_changes_assumption: true

controls:
  # Управляемые переменные. Для АВТ — по трём листам схем с кодами тегов (14.09) и
  # справочнику КИП, разбор — docs/AVT_SCHEMES.md §3. В цикле решений теги АВТ
  # рычагами не служат: оптимизатор двигает только уставки гидроочистки, так что
  # этот список — обоснованный перечень, а не то, чем система управляет.
  #
  # До схем здесь стояли T55, T1, T20, P22, F29, F30, F32. F29 (пар в К-2) ни на
  # схеме, ни в КИП управляемым не отмечен и убран. T1, T20, T55 на схеме не
  # выделены, но в КИП у них «Выход на FIRC…» — это регуляторы температуры, чью
  # уставку и задаёт оператор. Единицы расходов не записаны: W70/F30 = 0.78
  # показывает, что объёмные расходомеры АВТ пишут объём в условиях потока, а
  # F65 расходится с F7+F8+F9 множителем 1.255 (docs/AVT_SCHEMES.md §2).
  # Двойники на одном трубопроводе даны по одному, лучшим прибором из пары.
  avt:
    # К-1
    - {tag: "P2",  name: "Давление бензиновых паров верха К-1", source: "схема"}
    - {tag: "T6",  name: "Температура низа К-1", unit: "°C", source: "схема"}
    - {tag: "T1",  name: "Температура верха К-1", unit: "°C", source: "КИП: регулятор, выход на орошение F3"}
    # К-2
    - {tag: "P22", name: "Давление верха К-2", unit: "кгс/см2", source: "схема"}
    - {tag: "T20", name: "Температура верха К-2", unit: "°C", source: "КИП: регулятор, выход на острое орошение F19"}
    - {tag: "F19", name: "Расход острого орошения К-2", source: "схема"}
    - {tag: "F14", name: "Расход 1-го циркуляционного орошения К-2", source: "схема"}
    - {tag: "F12", name: "Расход 2-го циркуляционного орошения К-2", source: "схема"}
    - {tag: "F64", name: "Расход 3-го циркуляционного орошения К-2", source: "схема"}
    - {tag: "F65", name: "Производительность К-2 по отбензиненной нефти", source: "схема", note: "в 1.255 раза больше F7+F8+F9 при любой загрузке; баланс К-2 сходится на F65"}
    - {tag: "T33", name: "Температура низа К-2", unit: "°C", source: "схема"}
    - {tag: "F25", name: "Расход бензина после Т-26", source: "схема"}
    - {tag: "F34", name: "Расход фр. 150-250 °С с установки", source: "схема"}
    - {tag: "F32", name: "Расход фр. 240-290 °С с установки", source: "схема"}
    - {tag: "F30", name: "Расход фр. 290-350 °С с установки", source: "схема"}
    # печь П-3 и К-10
    - {tag: "T55", name: "Температура на выходе печи П-3", unit: "°C", source: "КИП: регулятор, выход на топливо П-3"}
    - {tag: "T49", name: "Температура верха К-10", unit: "°C", source: "схема"}
    - {tag: "T37", name: "Температура ВЦО в К-10", unit: "°C", source: "схема"}
    - {tag: "F56", name: "Расход фракции до 350 с установки", source: "схема", note: "двойник F57 на том же трубопроводе (отношение 0.856, corr 0.999); у F56 брака 0.1 %, у F57 — 4.0 %"}
    - {tag: "F59", name: "Расход фр. 350-560 с установки", source: "схема", note: "двойник F60 на том же трубопроводе (отношение 1.138, corr 0.998)"}
  ht:
    - {tag: "T5",  name: "Р-201: температура ГСС на выходе", unit: "°C"}
    - {tag: "T11", name: "Реакторный блок: температура",     unit: "°C", note: "буква верна, описание КИП («расход сырья массовый») данным не отвечает: с T6 corr 0.994"}
    - {tag: "F26", name: "Расход сырья на установку (объёмный)", scheme: "ht_feed_flow_m3h", unit: "м3/ч"}
    - {tag: "P13", name: "Давление в реакторном блоке",      scheme: "ht_pressure_mpa", unit: "МПа"}
    - {tag: "F15", name: "Расход квенча в Р-202",            unit: "нм3/ч"}
    - {tag: "P24", name: "Расход свежего ВСГ с КЦА",         unit: "тыс.нм3/ч", note: "газ/сырьё"}

split:
  # Только по времени. Перемешивание строк запрещено ТЗ.
  train: ["2023-01-01", "2025-06-30"]
  val:   ["2025-07-01", "2025-12-31"]
  test:  ["2026-01-01", "2026-08-07"]
  # Зазор между train и val/test, чтобы лаги не «протекали» через границу
  embargo_hours: 48

demo_windows:
  stable:      ["2025-11-01", "2025-12-15"]
  quality_risk: ["2026-06-01", "2026-06-30"]
  bad_data_frozen_pak: ["2026-04-14", "2026-04-28"]
  bad_data_lims_outlier: ["2024-04-22", "2024-04-25"]

optimization:
  # Поправка верхней границы температурных уставок на старение катализатора.
  # Диапазоны сняты с обучающего периода (катализатору там 14.4 мес), а он стареет
  # на 0.85 °C/мес: на старшем катализаторе оптимизатор не может поднять температуру
  # туда, где она нужна, и тег выпадает из рассмотрения. Поправка — скорость ×
  # разница ВОЗРАСТА катализатора по журналу замен, только вверх и не больше размаха
  # цикла (agents/outlook.aging_drift). По умолчанию ВЫКЛЮЧЕНО: включается только по
  # правилу приёмки, записанному до счёта (docs/PLAN.md), счёт —
  # scripts/check_aging_bounds.py. Проверено 21.09 и отклонено: условие 3 (отказов
  # меньше) не выполнено — на валидации поправка не изменила ни одного решения
  # (reports/aging_bounds.json).
  aging_bounds: false
  # Робастная гарантия: порядок пессимистичной кинетики, при которой вариант тоже
  # обязан держать запас по сере; null — проверки нет. Правило приёмки записано в
  # docs/PLAN.md до счёта и выполнено (scripts/check_robust_recommendation.py): в
  # имитации вмешательств меньше при любом порядке процесса (5→3 при первом, 13→8
  # при втором), превышений не больше, вклад в Т95 не выше; на тесте с шагом 1 ч ни
  # одно решение не изменилось. Поэтому включена по умолчанию.
  # Рабочая кинетика отклика серы на уставки: порядок реакции и сила отклика
  # (множитель приращения). 1.0 / 1.0 — первый порядок в полную силу, как было.
  #
  # Два источника, и они говорят разное.
  #
  # ПРАКТИКА УСТАНОВКИ (запись сессии 11.09, 13:56, docs/transcripts/qa_2026-09-11.txt):
  # подъём на 1 °C снижает серу на 0.3–1.0 мг/кг при уровне около 8 — это 4–12 %,
  # то есть литературные 5–10 %. Ответ был потерян в присланной расшифровке и
  # восстановлен распознаванием записи.
  #
  # ИСТОРИЯ (48 чистых эпизодов, docs/SULFUR_RESPONSE.md, участник 2): наблюдаемое
  # изменение — 0.035 от первого порядка на обучении и 0.056 на валидации, то есть
  # около 0.09 мг/кг на градус. Там же, в записи, эксперт объясняет разрыв: контуры
  # обратной связи «сильно затрудняют эту оценку», они гасят видимый отклик.
  #
  # Выбран порядок 1.5: 0.46 мг/кг на градус — середина практики. Правило приёмки и
  # обе его редакции — docs/PLAN.md, счёт — scripts/check_kinetic_strength.py.
  # Первый порядок давал 1.55 (выше практики), второй — 0.24 (ниже).
  kinetic_order: 1.5
  kinetic_strength: 1.0
  robust_kinetic_order: 2.0
  # Четыре критерия ТЗ и то, чем каждый из них измеряется у нас. Веса
  # используются только ПОСЛЕ отсева недопустимых вариантов: экономика не может
  # перевесить нарушение спецификации.
  objective_weights:
    # «качество продукции» — запас по сере до предела
    quality_margin: 0.45
    # «экономическая эффективность» — выпуск гидроочищенного ДТ. Цен в пакете нет,
    # поэтому экономика выражена в тоннах, а не в рублях; ДОПУЩЕНИЕ помечено в
    # docs/DATA_NOTES.md §5. При постоянном качестве выручка пропорциональна выпуску.
    throughput: 0.25
    # «энергопотребление» — прозрачный прокси топлива печи и нагрева ГСС
    energy_proxy: 0.15
    # «надёжность оборудования» — тяжесть режима (WABT, ΔP, наработка, аномальность)
    severity: 0.15
    # подавление воздействия: при прочих равных меньшее вмешательство лучше.
    # Не критерий ТЗ, а свойство регулятора: без него замкнутый контур уводит
    # уставки в упор допустимого дрейфа и начинает рыскать. ДОПУЩЕНИЕ.
    move_penalty: 0.20
  pareto: true
  n_candidates: 200
  random_seed: 42

# Необязательный слой локальной LLM (src/nefte/llm_explain.py): ответ оператору на
# «почему?» по решению. Внутри сети предприятия есть модель с OpenAI-совместимым API
# (ответ организаторов 11.09). Модель получает только структуру решения, а ответ с
# числом, которого там нет, отклоняется. Система полностью работает без слоя.
