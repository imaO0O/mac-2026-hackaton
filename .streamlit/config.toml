# Дашборд работает в закрытом контуре: технологическая сеть с интернетом не связана.
# Статистику использования Streamlit по умолчанию отправляет наружу — отключено.
[browser]
gatherUsageStats = false

[server]
headless = true

# Светлая тема: дашборд показывают на проекторе, а в тёмной теме лабораторные
# точки на графике серы терялись на фоне.
[theme]
base = "light"

# Без кнопки Deploy: это локальный прототип в закрытом контуре.
[client]
toolbarMode = "minimal"
